.topbar,.botbar{background:var(--g1);height:18px}.botbar{height:22px}
header{background:#fff;padding:18px 32px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);box-shadow:0 2px 10px #00362e12;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.brand img{height:58px;display:block}
.ttl{border-left:3px solid var(--g3);padding-left:20px}
h1{margin:0;font-size:26px;color:var(--g1);letter-spacing:-.3px}header p{margin:3px 0 0;color:var(--gr);font-size:13px;font-weight:600}
.tools{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mut);flex-wrap:wrap}
.btn{background:var(--g2);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:13px;transition:.15s}.btn:hover{background:var(--g1)}
main{max-width:1400px;margin:auto;padding:24px 24px 40px;position:relative;z-index:1}
h2{font-size:17px;margin:34px 0 12px;color:var(--g1);display:flex;align-items:center;gap:10px}
h2::before{content:"";width:6px;height:20px;border-radius:3px;background:linear-gradient(var(--g3),var(--g1))}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.card{background:var(--card);border-radius:14px;padding:18px 18px 16px;box-shadow:0 2px 8px #00362e14;border-top:5px solid var(--g2);cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px #00362e22}
.card small{color:var(--mut);font-weight:700;font-size:11px;letter-spacing:.06em}.card b{display:block;font-size:40px;margin-top:6px;line-height:1.1}
.panel{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 8px #00362e12;overflow-x:auto}
.pend{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.pi{cursor:pointer;padding:12px;border-radius:12px;border:2px solid transparent;background:var(--card);box-shadow:0 2px 6px #00362e10;transition:.15s}.pi:hover{border-color:var(--g3)}
.pi.on{border-color:var(--bad)}.pi div{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px}
.bar{height:12px;background:#e8eeec;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e86a6a,var(--bad));border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--g1);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:1}
th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
td.n,th.n{text-align:right}tbody tr.g{cursor:pointer}tbody tr:hover{background:#eef6f2}tr.tot td{font-weight:700;background:#e8f1ed;color:var(--g1)}
.pc{display:inline-block;min-width:46px;padding:2px 9px;border-radius:99px;font-weight:700;font-size:12px;text-align:center;background:#d8f0e4;color:#0b5a3c}.pc.m{background:#fdecc8;color:#8a5600}.pc.l{background:#fbdada;color:#9a1f1f}
.tag{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}.t1{background:#d8f0e4;color:#0b5a3c}.t2{background:#fdecc8;color:#8a5600}.t3{background:#e6e8e8;color:#4b5250}
.x{display:inline-block;background:#fbdada;color:#9a1f1f;border-radius:6px;padding:2px 7px;margin:1px;font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.filters input,.filters select{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px;max-width:200px;background:#fff;color:var(--ink)}
.filters input:focus,.filters select:focus{outline:2px solid var(--g3);border-color:transparent}
.scroll{max-height:560px;overflow:auto}#msg{padding:30px;text-align:center;color:var(--mut)}
footer{text-align:center;color:#cfe3dc;font-size:12px;padding:0}.botbar{display:flex;align-items:center;justify-content:center}
.botbar span{font-size:11px;color:#cfe3dc}
@media(max-width:700px){header{padding:14px 16px}.brand img{height:44px}h1{font-size:20px}.ttl{padding-left:14px}main{padding:16px 12px 30px}}

<script>

const COL={placa:'placa',crlv:'crlv',arr:'contrato de arrendamento',antt:'inclusao na antt',gr:'gr e cadastro no mercado livre',com:'contrato de comodato',veloe:'cartao veloe',svc:'svc implantacao',regional:'regional',modal:'modal',locadora:'locadora',modelo:'modelo',prev:'previsao final entrega',ent:'entregue'};
const GRUPOS=[['svc','Acompanhamento por SVC'],['modal','Acompanhamento por Modal'],['locadora','Acompanhamento por Locadora'],['regional','Acompanhamento por Regional'],['modelo','Acompanhamento por Modelo']];
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
const txt=s=>String(s??'').replace(/\s+/g,' ').trim();
function toDate(v){let d=null;if(v instanceof Date)d=v;else if(typeof v==='number'&&v>20000)d=new Date(Math.round((v-25569)*864e5));
 else if(typeof v==='string'){const m=v.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)d=new Date(Date.UTC(+m[3],m[2]-1,+m[1]));else if(/^\d{4}-\d{2}-\d{2}/.test(v.trim()))d=new Date(v.trim().slice(0,10))}
 return d&&!isNaN(d)?d:null}
const fmt=d=>d?d.toISOString().slice(8,10)+'/'+d.toISOString().slice(5,7)+'/'+d.getUTCFullYear():'-';

function carregar(buf){
 const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[ABA]||wb.Sheets[wb.SheetNames.find(n=>norm(n)===norm(ABA))]||wb.Sheets[wb.SheetNames[0]];
 const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
 const h=rows[0].map(norm),ix={};for(const k in COL)ix[k]=h.indexOf(COL[k]);
 const falta=Object.keys(COL).filter(k=>ix[k]<0);
 DATA=rows.slice(1).filter(r=>txt(r[ix.placa])).map(r=>{
  const o={placa:txt(r[ix.placa]).toUpperCase()};
  ITENS.forEach(([k])=>o[k]=norm(r[ix[k]])==='ok');
  o.pend=ITENS.filter(([k])=>!o[k]).map(([,n])=>n);o.pk=ITENS.filter(([k])=>!o[k]).map(([k])=>k);
  ['svc','regional','modal','locadora','modelo'].forEach(k=>o[k]=txt(r[ix[k]])||'(vazio)');
  o.ent=toDate(r[ix.ent]);o.prev=toDate(r[ix.prev]);o.entregue=!!o.ent;o.naoApto=o.pend.length>0;o.apto=o.entregue&&!o.naoApto;

function stats(a){const e=a.filter(v=>v.entregue).length,ap=a.filter(v=>v.apto).length;return{t:a.length,e,f:a.length-e,ap,na:a.filter(v=>v.naoApto).length,pe:pct(e,a.length),pa:pct(ap,e)}}

 document.getElementById('app').innerHTML=h;grafico();filtros();tabela()}
function grafico(){if(CH)CH.destroy();const m={};DATA.forEach(v=>(m[v.svc]=m[v.svc]||[]).push(v));const ls=Object.entries(m).sort((a,b)=>b[1].length-a[1].length);
 CH=new Chart(document.getElementById('ch'),{type:'bar',data:{labels:ls.map(l=>l[0]),datasets:[
 {label:'Aptos para rodar',data:ls.map(l=>l[1].filter(v=>v.apto).length),backgroundColor:'#01362e'},
 {label:'Entregues — pendências',data:ls.map(l=>l[1].filter(v=>v.entregue&&v.naoApto).length),backgroundColor:'#e8a630'},
 {label:'Aguardando entrega',data:ls.map(l=>l[1].filter(v=>!v.entregue).length),backgroundColor:'#8a8d8f'}]},
 options:{indexAxis:'y',maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true}},plugins:{legend:{position:'bottom'}}}})}
function filtros(){const u=k=>[...new Set(DATA.map(v=>v[k]))].sort();
 const sel=(k,l)=>`<select onchange="F['${k}']=this.value;tabela()" id="f_${k}"><option value="">${l}: todos</option>${u(k).map(x=>`<option ${F[k]===x?'selected':''}>${x}</option>`).join('')}</select>`;
 document.getElementById('flt').innerHTML=`<input id="f_q" placeholder="Buscar placa…" value="${F.q||''}" oninput="F.q=this.value;tabela()">
 <select id="f_st" onchange="F.st=this.value;tabela()"><option value="">Status: todos</option>${['APTO PARA RODAR','ENTREGUE — PENDÊNCIAS','AGUARDANDO ENTREGA'].map(x=>`<option ${F.st===x?'selected':''}>${x}</option>`).join('')}<option value="na" ${F.st==='na'?'selected':''}>NÃO APTO (qualquer pendência)</option></select>
 ${sel('svc','SVC')}${sel('modal','Modal')}${sel('locadora','Locadora')}${sel('regional','Regional')}${sel('modelo','Modelo')}
 <select id="f_pend" onchange="F.pend=this.value;tabela()"><option value="">Pendência: todas</option>${ITENS.map(([k,n])=>`<option value="${k}" ${F.pend===k?'selected':''}>${n}</option>`).join('')}</select>
 <button class="btn" style="background:var(--g1);color:#fff" onclick="setF({},1)">Limpar filtros</button>`}
function setF(o,reset){F=Object.assign(reset?{}:{},o);if(o.st==='ent')F.st='ent';render();document.getElementById('flt').scrollIntoView({behavior:'smooth'})}
function tabela(){let a=DATA.filter(v=>(!F.q||v.placa.includes(F.q.toUpperCase()))&&(!F.st||(F.st==='ent'?v.entregue:F.st==='na'?v.naoApto:v.st===F.st))&&['svc','modal','locadora','regional','modelo'].every(k=>!F[k]||v[k]===F[k])&&(!F.pend||v.pk.includes(F.pend)));
 document.getElementById('cnt').textContent=a.length+' de '+DATA.length+' veículos'+(F.st==='ent'?' (entregues)':'');
 document.getElementById('tb').innerHTML=a.map(v=>`<tr><td><b>${v.placa}</b></td><td>${v.svc}</td><td>${v.modal}</td><td>${v.locadora}</td><td>${v.regional}</td><td>${v.modelo}</td><td>${fmt(v.prev)}</td><td>${fmt(v.ent)}</td><td><span class="tag ${v.apto?'t1':v.entregue?'t2':'t3'}">${v.apto?'🟢':v.entregue?'🟡':'🔵'} ${v.st}</span> ${v.naoApto?'<span class="tag" style="background:#fee2e2;color:#991b1b">🔴 NÃO APTO</span>':''}</td><td>${v.pend.map(p=>`<span class="x">❌ ${p}</span>`).join('')||'—'}</td></tr>`).join('')}
function aplicar(buf){const u=new Uint8Array(buf);let c=u.length;for(let i=0;i<u.length;i+=7)c=(c*31+u[i])|0;if(c===SIG)return;SIG=c;carregar(buf);document.getElementById('upd').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR')}
async function buscar(){try{const r=await fetch(ARQ+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);aplicar(await r.arrayBuffer())}
 catch(e){if(!DATA.length)document.getElementById('app').innerHTML='<div id="msg">Não foi possível ler <b>'+ARQ+'</b> (abra via GitHub Pages/servidor local ou use “Carregar planilha”).</div>'}}
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(f)f.arrayBuffer().then(b=>{SIG=null;aplicar(b)})};
buscar();setInterval(buscar,POLL);
</script></body></html>
